<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Side ikke fundet | Betul Senelmis</title>
  <link rel="stylesheet" href="/css/style1.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error-box {
      max-width: 600px;
      background: #12141c;
      border: 1px solid rgba(235, 74, 74, 0.3);
      border-radius: 1rem;
      padding: 3rem 2rem;
    }
    .error-box h1 {
      font-size: clamp(3rem, 6vw, 5rem);
      margin-bottom: 1rem;
    }
    .error-box p {
      color: #c5c5c5;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>404</h1>
    <h2>Side ikke fundet</h2>
    <p>Den side, du leder efter, findes ikke eller er flyttet. Gå tilbage til forsiden og find det du søger.</p>
    <a href="/" class="btn">Tilbage til forsiden</a>
  </div>
</body>
</html>
